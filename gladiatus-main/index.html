<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gladiatus Fake</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <nav>
        <img src="./img/logo-branco.png" alt="Logo Gladiatus">
    </nav>

    <main>
        <section class="registro">
            <label for="usuario">E-mail.</label>
            <input type="text" id="usuario">

            <label for="senha">Senha</label>
            <input type="password" id="senha">

            <div id="log-aut">
                <input type="checkbox" id="logon">
                <label for="logon">Login Automático</label>
            </div>

            <small id="termos">Ao efetuar o login, eu aceito o <strong>T&Cs.</strong></small>

            <section class="login-section">
                <button id="bt-login"><strong>LOGIN</strong></button>
                <button id="bt-face">Login pelo Facebook</button>
                <button id="bt-google">Faça login no Google</button>
            </section>
        </section>
    </main>
   
    <footer>
        <div id="links">
            <p>Links</p>
        </div>
   
        <div id="gladiatus">        
            <p>Gladiatus</p>
        </div>
        <small>
                No jogo de navegador Gladiatus, uma vida de combate no auge do Império Romano te espera. Lute contra uma multidão de oponentes em expedições e supere os perigos das masmorras. Encontre aliados para a batalha e pela glória e honra nas arenas.
        </small>
    </footer>
</body>
</html>
